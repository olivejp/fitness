name: fitnc_user
description: Fitness-Nc for user

publish_to: 'none'

version: 1.0.1+4

environment:
  sdk: ^3.11.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  audioplayers: ^6.8.1
  stop_watch_timer: ^3.2.2
  numberpicker: ^2.1.2
  flutter_time_picker_spinner: ^2.0.0
  syncfusion_flutter_datepicker: ^34.2.3
  connectivity_plus: ^7.3.1
  oktoast: ^3.4.0
  rxdart: ^0.28.0
  firebase_auth: ^6.5.7
  firebase_storage: ^13.4.6
  firebase_core: ^4.13.0
  cloud_functions: ^6.3.6
  cloud_firestore: ^6.8.0
  loading_animations: ^2.2.0
  google_fonts: ^8.2.1
  cached_network_image: ^3.4.1
  get_it: ^9.2.1
  go_router: ^17.5.0
  shared_preferences: ^2.5.5
  tuple: ^2.0.2
  # charts_flutter (google/charts) est abandonné et son URL git:// n'est plus
  # joignable ; community_charts_flutter en est le fork maintenu, API identique.
  community_charts_flutter: ^1.0.4
  intl: ^0.20.2
  # Remontées depuis les ex-packages internes `firebase` et `fitness_domain`,
  # réintégrés dans lib/ (voir MIGRATION.md, chantier 8).
  file_picker: ^11.0.3
  http: ^1.6.0
  json_annotation: ^4.12.0
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  build_runner: ^2.15.1
  json_serializable: ^6.14.1
  lint: ^2.8.0
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Active la génération des localisations (gen-l10n) à chaque pub get / build.
  generate: true
  assets:
    - images/fitness_login_page/
    - assets/notification.wav

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "images/fitness_logo_3.png"
  remove_alpha_ios: true
